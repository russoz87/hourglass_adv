; Hourglass - PlatformIO project for the M5Stack Cardputer-ADV.
;
; Build only:              pio run
; Install on the device:   copy .pio/build/cardputer-adv/firmware.bin to a
;                          microSD card and install it from the Launcher SD
;                          menu. Never use `-t upload` / esptool on this
;                          device: that would overwrite the installed Launcher.
;
; Versions below are pinned on purpose; they are the ones this project has
; been built and (later) verified with.
;
; Toolchain note: espressif32@8.0.0 (arduino-esp32 3.3.12, ESP-IDF 5.5) made
; every speaker call panic with a reset (ESP_RST_PANIC) on this board's
; ES8311 codec - the same regression family documented in
; espressif/esp-idf#18621 for the Cardputer-ADV. The toolchain below is the
; generation the shipped AdvanceOS build uses (arduino-esp32 2.0.17 / IDF
; 4.4, see the commented ;espressif32 @ 6.12.0 in its platformio.ini) and
; its audio is proven on this exact hardware.

[env:cardputer-adv]
platform = espressif32@6.13.0
board = m5stack-stamps3
framework = arduino

; The Cardputer(-ADV) board manifest only exists in espressif32 >= 8.0.0; on
; this platform the board is the StampS3 it is built from - exactly what
; AdvanceOS uses. The native-USB Serial console needs the CDC-on-boot flag,
; which the stamps3 manifest does not set.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_M5STACK_CARDPUTER

; M5Cardputer 1.1.x knows the Cardputer-ADV keyboard (TCA8418) and picks the
; right reader from the board detected by M5GFX/M5Unified, so M5Unified and
; M5GFX have to be new enough to detect board_M5CardputerADV. M5Unified 0.2.20
; is the AdvanceOS-era release that already contains the Cardputer-ADV
; speaker/mic (ES8311) support; it requires M5GFX >= 0.2.27, and 0.2.27 is
; the first M5GFX line that knows the board. Newer M5Unified (0.2.22+) reworks
; the speaker task; it is the version that panicked here on every audio call.
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.20
    m5stack/M5GFX@0.2.27

; The stock board definition describes the original Cardputer (4 MB flash).
; The Cardputer-ADV has 8 MB, so the image header is built for 8 MB.
board_upload.flash_size = 8MB

; Launcher installs apps into a single slot at 0x10000, 0x150000 bytes long
; (see partitions.csv). Limiting the maximum image size here makes `pio run`
; fail instead of producing a .bin that cannot be installed.
board_build.partitions = partitions.csv
board_upload.maximum_size = 1376256  ; 0x150000

monitor_speed = 115200

; Refuse `-t upload` / `-t erase`: this device boots Launcher, Hourglass is
; installed as an app from microSD. See scripts/guard_usb_flash.py.
extra_scripts = scripts/guard_usb_flash.py
